name: Hourly Auto Post Bot

on:
  schedule:
    - cron: '0 * * * *'  # පැයකට සැරයක් Auto Run වේ
  workflow_dispatch:      # GitHub Dashboard එකෙන් Manual Run කිරීමට

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Poster Script
        run: python runner.py

      - name: Commit and Push Updated queue.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update queue.json after posting [skip ci]" && git push)
